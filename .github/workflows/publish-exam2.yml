name: Validate Exam 2 build and scoring key

# Tnufa is the only source of exam content. This workflow validates artifacts,
# but NEVER writes to the publication repository.
# GitHub Pages publishing is owned exclusively by
# yanivmizrachiy/tnufa-exam-2/.github/workflows/publish-from-source.yml.
on:
  push:
    branches: [main]
    paths:
      - 'exams/tnufa-exam-2/**'
      - '.github/workflows/publish-exam2.yml'
  pull_request:
    paths:
      - 'exams/tnufa-exam-2/**'
      - '.github/workflows/publish-exam2.yml'
  workflow_dispatch:

concurrency:
  group: validate-exam2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical Tnufa source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chromium and PDF dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pymupdf
          python -m playwright install --with-deps chromium

      - name: Build 17 student sheets, 41-part scoring key and district reader
        run: python exams/tnufa-exam-2/build.py --student --snapshots

      - name: Fail closed on real PDF contents, manifests and scoring table
        run: python exams/tnufa-exam-2/tools/publish.py --verify-only

      - name: Upload QA artifacts (no publishing)
        uses: actions/upload-artifact@v4
        with:
          name: tnufa-exam-2-verified
          path: exams/tnufa-exam-2/public
          if-no-files-found: error
